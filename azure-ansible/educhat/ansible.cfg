# Create ansible.cfg in your project root. This tells Ansible where to find roles and inventories,
# enables SSH pipelining for performance, and disables host key checking (you can tighten this for production):

[defaults]
stdout_callback = default
result_format = yaml
roles_path = ./roles
inventory = ./inventories/home/hosts.yaml
retry_files_enabled = False
host_key_checking = False
gathering = smart
forks = 10
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
