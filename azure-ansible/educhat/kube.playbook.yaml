# https://blog.stephane-robert.info/docs/infra-as-code/gestion-de-configuration/ansible/premiers-pas/premier-playbook/#:~:text=Les%20cl%C3%A9s%20essentielles%20d%27un%20play%20%3A
# https://fouts.dev/posts/deploying-k3s-with-ansible-a-complete-tutorial/
---
- name: Install K3s on master node
  hosts: k3s_master
  become: true
  roles:
    - xanmanning.k3s
  tags: [k3s, master]

- name: Install K3s on worker nodes
  hosts: k3s_workers
  become: true
  serial: 1
  roles:
    - xanmanning.k3s
  tags: [k3s, workers]

- name: Verify K3s cluster
  hosts: k3s_master
  become: true
  tasks:
    # "Vérifie toutes les 10 secondes si tous les nodes K3s sont Ready.
    # Attends maximum 5 minutes. Si après 5 minutes ce n'est pas le cas, échoue."
    - name: Wait for all nodes to be ready
      ansible.builtin.shell: |
        kubectl get nodes --no-headers | grep "NotReady" | wc -l
      # Stockez le résultat de la commande: "kubectl ..." dans une variable not_ready_nodes.
      # On peut ensuite lire not_ready_nodes.stdout afin de voir ce que la commande a renvoyé.
      register: not_ready_nodes
      # Répète la task jusqu'à ce que tous les nodes Ready ("0").
      until: not_ready_nodes.stdout == "0"
      retries: 30
      delay: 10
      environment:
        # Sans KUBECONFIG, kubectl ne sait pas où est le cluster et retourne une erreur:
        # The connection to the server localhost:8080 was refused
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      # Dit à Ansible que cette task ne modifie rien sur le système. C'est juste une vérification.
      # Sans ça, Ansible marquerait la task comme "changed" à chaque exécution, ce qui fausserait les rapports.
      changed_when: false

    - name: Display cluster status
      ansible.builtin.command: kubectl get nodes -o wide
      register: cluster_status
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: Show cluster nodes
      ansible.builtin.debug:
        msg: "{{ cluster_status.stdout_lines }}"
  tags: [k3s, verify]

- name: Install Helm in VM's
  hosts: k3s_master
  become: true
  tasks:
    # Source - https://stackoverflow.com/a/76181866
    # Posted by Sergey Kalikin, modified by community. See post 'Timeline' for change history
    # Retrieved 2026-05-27, License - CC BY-SA 4.0
    # ---
    - name: Download Helm command line tool
      ansible.builtin.uri:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        return_content: true
      register: helm_installer

    - name: Install Helm
      ansible.builtin.command:
        cmd: bash
        stdin: "{{ helm_installer.content }}"
        creates: /usr/local/bin/helm
      environment:
        DESIRED_VERSION: "{{ helm_version | default('') }}"

    - name: Copy kubernetes files in VM
      ansible.builtin.copy:
        src: ../../azure-kubernetes/
        dest: /home/adminuser/azure-kubernetes/
        mode: '0644'
  tags: [helm, install]

- name: Deploy with Helm in VM's
  hosts: k3s_master
  become: true
  tasks:
    - name: Create dev namespace
      ansible.builtin.command:
        cmd: kubectl create namespace dev
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      failed_when: false
      changed_when: false
    # (les métadonnées de la release).
    # Sans --namespace, Helm stocke ses métadonnées dans default même si tes pods sont dans dev.
    # --create-namespace est utile si dev n'existe pas encore
    - name: Deploy Educhat app
      ansible.builtin.command:
        cmd: >
          helm upgrade --install educhat /home/adminuser/azure-kubernetes
          --namespace dev
          --values /home/adminuser/azure-kubernetes/values.yaml
          --values /home/adminuser/azure-kubernetes/values.secret.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tags: [helm, deploy]