# https://blog.stephane-robert.info/docs/infra-as-code/gestion-de-configuration/ansible/premiers-pas/premier-playbook/#:~:text=Les%20cl%C3%A9s%20essentielles%20d%27un%20play%20%3A
# https://fouts.dev/posts/deploying-k3s-with-ansible-a-complete-tutorial/
---
- name: Install K3s on master node
  hosts: k3s_master
  become: true
  roles:
    - xanmanning.k3s
  tags: [k3s, master]

- name: Install K3s on worker nodes
  hosts: k3s_workers
  become: true
  serial: 1
  roles:
    - xanmanning.k3s
  tags: [k3s, workers]

- name: Verify K3s cluster
  hosts: k3s_master
  become: true
  tasks:
    - name: Wait for all nodes to be ready
      ansible.builtin.shell: |
        kubectl get nodes --no-headers | grep -v " Ready" | wc -l
      register: not_ready_nodes
      until: not_ready_nodes.stdout == "0"
      retries: 30
      delay: 10
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: Display cluster status
      ansible.builtin.command: kubectl get nodes -o wide
      register: cluster_status
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: Show cluster nodes
      ansible.builtin.debug:
        msg: "{{ cluster_status.stdout_lines }}"

  tags: [k3s, verify]

- name: Install Helm in VM's
  hosts: k3s_master
  become: true
  tasks:
    # Source - https://stackoverflow.com/a/76181866
    # Posted by Sergey Kalikin, modified by community. See post 'Timeline' for change history
    # Retrieved 2026-05-27, License - CC BY-SA 4.0
    # ---
    - name: Download Helm command line tool
      ansible.builtin.uri:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        return_content: true
      register: helm_installer
      tags: helm

    - name: Install Helm
      ansible.builtin.command:
        cmd: bash
        stdin: "{{ helm_installer.content }}"
        creates: /usr/local/bin/helm
      environment:
        DESIRED_VERSION: "{{ helm_version | default('') }}"
      tags: helm

    - name: Copy kubernetes files in VM
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/home/adminuser/"
        mode: '0644'
      loop:
        - ../azure-kubernetes/*

    - name: Deploy Educhat with Helm
      ansible.builtin.command:
        cmd: >
          helm upgrade --install educhat /home/adminuser/azure-kubernetes
          --namespace dev
          --create-namespace
          --values /home/adminuser/azure-kubernetes/values.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml