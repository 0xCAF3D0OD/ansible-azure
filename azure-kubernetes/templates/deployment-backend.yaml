apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.app.name }}-{{ .Values.deployments.backend }}"
  namespace: {{ .Values.namespace }}
  labels:
    app: "{{ .Values.app.name }}-{{ .Values.services.backend }}"
spec:
  replicas: {{ .Values.replicas.backend }}
  selector:
    matchLabels:
      app: "{{ .Values.app.name }}-{{ .Values.services.backend }}"
  template:
    metadata:
      labels:
        app: "{{ .Values.app.name }}-{{ .Values.services.backend }}"
    spec:
      containers:
        - name: "{{ .Values.app.name }}-{{ .Values.services.backend }}"
          image: "{{ .Values.images.backend }}"
          ports:
            - containerPort: {{ .Values.ports.backend }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: "{{ .Values.config.app.configMap }}"
            - secretRef:
                name: "{{ .Values.config.app.secrets }}"

          resources:
            {{- toYaml .Values.resources | nindent 12 }}