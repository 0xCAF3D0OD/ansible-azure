apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.app.name }}-{{ .Values.deployments.redis }}"
  namespace: {{ .Values.namespace }}
  labels:
    app: "{{ .Values.app.name }}-{{ .Values.services.redis }}"
spec:
  replicas: {{ .Values.replicas.redis }}
  selector:
    matchLabels:
      app: "{{ .Values.app.name }}-{{ .Values.services.redis }}"
  template:
    metadata:
      labels:
        app: "{{ .Values.app.name }}-{{ .Values.services.redis }}"
    spec:
      containers:
        - name: "{{ .Values.app.name }}-{{ .Values.services.redis }}"
          image: "{{ .Values.images.redis }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.ports.redis }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: "{{ .Values.config.app.configMap }}"
            - secretRef:
                name: "{{ .Values.config.app.secrets }}"

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      