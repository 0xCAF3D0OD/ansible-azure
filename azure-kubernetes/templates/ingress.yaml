apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Values.app.name }}-ingress"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.app.name }}-{{ .Values.services.frontend }}"
                port:
                  number: {{ .Values.ports.ingress }}

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.app.name }}-{{ .Values.services.backend }}"
                port:
                  number: {{ .Values.ports.ingress }}
