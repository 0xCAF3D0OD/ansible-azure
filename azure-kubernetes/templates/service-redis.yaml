apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.app.name }}-{{ .Values.services.redis }}"
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: "{{ .Values.app.name }}-{{ .Values.services.redis }}"
  ports:
    - protocol: TCP
      port: {{ .Values.ports.redis }}
      targetPort: {{ .Values.ports.redis }}
  type: ClusterIP
  